# Test profile: used only by the automated tests in src/test.
# Uses its own database. The tests WIPE it before every test, so never point this at a real one.
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_advisory_test

# DB_USERNAME / DB_PASSWORD come from your local file, so no password is committed here.
spring.config.import=optional:classpath:application-local.properties

# Tests rebuild the schema with Flyway clean + migrate (ApiTestBase checks the name ends in _test).
spring.flyway.clean-disabled=false

# ID-number keys FOR AUTOMATED TESTS ONLY. Random, made for this file, used nowhere else.
# They protect only the fake ID numbers the tests create. Never use these for real data.
# (If your application-local.properties has its own keys, those are used instead.)
app.idnumber.lookup-key=cJpRtXeLvQ6dzOaS0a0DE3m9FkFUUMGqdAsbhvgcpjk=
app.idnumber.encryption-key=IN1fQqCXFTZVSSIs0WfWqHwNqsDef+IdWXnLOQxbcXE=
# Test-only key. MFA is off for most tests (every sign-in would need a code);
# MfaApiTest turns it on.
app.mfa.encryption-key=J1+Ui8Os+i4SX3Zc6dLGAiD628kVanJ0YH9haOH2wbw=
app.mfa.required=false

# Keep test output readable
logging.level.root=WARN

# Consultant onboarding: the tests call LoginDetailsSender.sendDue() themselves and use
# FakeLoginDetailsMailer (src/test), so the background sender never runs on its own.
app.onboarding.send-initial-delay=PT24H
app.onboarding.send-interval=PT24H
app.onboarding.login-url=https://credit-advisory.test.local
