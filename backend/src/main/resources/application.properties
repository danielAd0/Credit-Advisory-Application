spring.application.name=credit-advisory
spring.profiles.active=local

# Database (credentials come from the local profile, never from this file)
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_advisory
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Only expose the health endpoint
management.endpoints.web.exposure.include=health

# ---------- Sessions ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Errors as RFC 9457 ProblemDetail JSON ----------
spring.mvc.problemdetails.enabled=true

# ---------- Sign-in lockout ----------
app.auth.max-failed-attempts=5
app.auth.lock-duration=15m
