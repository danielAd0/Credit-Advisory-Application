spring.application.name=credit-advisory

# No profile is chosen here on purpose. .\mvnw.cmd spring-boot:run uses "local" (pom.xml),
# the tests use "test", and a server must set SPRING_PROFILES_ACTIVE=prod.
# Starting with no profile at all is refused (NoProfileGuard).

# Database for development (credentials come from the local profile, never from this file).
# Production overrides all three in application-prod.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_advisory
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration
# A migration file with a wrong name (e.g. V__19x.sql instead of V19__x.sql) stops start-up
# instead of being skipped without a word.
spring.flyway.validate-migration-naming=true

# Only the health endpoint, and only "UP" or "DOWN": no details about the database or disk.
# In production it moves to its own port that only the load balancer can reach (application-prod.properties).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ---------- Sessions ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Errors as RFC 9457 ProblemDetail JSON ----------
spring.mvc.problemdetails.enabled=true

# ---------- Sign-in lockout (per account) ----------
app.auth.max-failed-attempts=5
app.auth.lock-duration=15m

# ---------- Sign-in rate limit (per network address) ----------
# After this many FAILED sign-ins from one address within the window, that address gets 429.
app.auth.max-failed-sign-ins-per-ip=20
app.auth.ip-window=5m

# ---------- Showing a full ID number ----------
# The user must re-enter their password (POST /api/auth/reauthenticate); it counts this long.
app.auth.password-confirmation-window=5m
# Full ID numbers one user may see per hour, then 429 and an ID_REVEAL_LIMIT_REACHED audit entry.
app.auth.max-id-reveals-per-hour=20

# ---------- Two-step sign-in (MFA) ----------
# Every user enters a code from an authenticator app after the password.
# Production refuses to start with false. The key comes from the profile files / MFA_ENCRYPTION_KEY.
app.mfa.required=true
app.mfa.issuer=Credit Advisory

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---------- Consultant onboarding (docs/consultant-onboarding.md) ----------
# Microsoft 365 takes about 30 emails a minute from one mailbox: 10 every 30 s stays under it.
app.onboarding.send-batch=10
app.onboarding.send-interval=PT30S
app.onboarding.max-attempts=4
app.onboarding.company-name=Mafori Group