# =====================================================================
# Production profile. Start the server with SPRING_PROFILES_ACTIVE=prod.
#
# NOTHING secret lives in this file. Every secret comes from an environment
# variable that IT sets on the server (README, "Running in production").
# If one is missing or a setting is unsafe, the application refuses to start
# and names the variable (ProductionSafetyCheck).
# =====================================================================

# ---------- Database ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Flyway clean deletes every table. Never in production.
spring.flyway.clean-disabled=true

# A database on the same machine as the app is refused unless IT sets this to true
# (it usually means DB_URL was copied from a developer's settings).
app.safety.allow-local-database=${ALLOW_LOCAL_DATABASE:false}

# ---------- ID-number keys (created and held by IT, never by developers) ----------
app.idnumber.lookup-key=${ID_NUMBER_LOOKUP_KEY}
app.idnumber.encryption-key=${ID_NUMBER_ENCRYPTION_KEY}

# ---------- Two-step sign-in (MFA) key (created and held by IT; its own key) ----------
app.mfa.encryption-key=${MFA_ENCRYPTION_KEY}
app.mfa.required=true

# ---------- Network: listen only where the proxy can reach (README, "Network checklist") ----------
# The application listens on ONE address, never on every network card. 127.0.0.1 when the
# reverse proxy runs on this machine; otherwise IT sets the private address the proxy connects to.
server.address=${SERVER_ADDRESS:127.0.0.1}
# The health check gets its own port, separate from the application, that is never published:
# only the load balancer / monitoring may reach it. It answers only {"status":"UP"} or DOWN.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}

# ---------- Session cookie over HTTPS only ----------
server.servlet.session.cookie.secure=true

# ---------- Behind a reverse proxy / load balancer ----------
# Take the client address and https from X-Forwarded-For / X-Forwarded-Proto.
# Tomcat only trusts these headers from proxies on a private network, so the
# sign-in rate limit counts each user rather than the proxy.
server.forward-headers-strategy=native

# ---------- CORS ----------
# Empty: the frontend is served from the same address as the API.
# If it is not, IT sets CORS_ALLOWED_ORIGINS to its https:// address.
app.auth.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---------- First administrator (first start-up only, then removed) ----------
app.bootstrap.admin-email=${FIRST_ADMIN_EMAIL:}
app.bootstrap.admin-password=${FIRST_ADMIN_PASSWORD:}

# ---------- Consultant login emails (docs/consultant-onboarding.md, "Mail set-up") ----------
# Sent through Microsoft 365 with Microsoft Graph, as an Entra ID app registration.
# Until all four MAIL_* values are set, nothing is emailed (the admin screen says so).
app.mail.graph.tenant-id=${MAIL_GRAPH_TENANT_ID:}
app.mail.graph.client-id=${MAIL_GRAPH_CLIENT_ID:}
app.mail.graph.client-secret=${MAIL_GRAPH_CLIENT_SECRET:}
app.mail.sender=${MAIL_SENDER:}
# The sign-in address written in the emails, e.g. https://credit-advisory.mafori.co.za
app.onboarding.login-url=${APP_LOGIN_URL:}
app.onboarding.support-contact=${ONBOARDING_SUPPORT_CONTACT:your manager}

# ---------- Errors and logging ----------
server.error.include-stacktrace=never
server.error.include-message=never
logging.level.root=INFO
