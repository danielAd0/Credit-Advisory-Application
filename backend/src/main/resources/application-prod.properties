# =====================================================================
# Production profile. Start the server with SPRING_PROFILES_ACTIVE=prod.
#
# NOTHING secret lives in this file. Every secret comes from an environment
# variable that IT sets on the server (README, "Running in production").
# If one is missing or a setting is unsafe, the application refuses to start
# and names the variable (ProductionSafetyCheck).
# =====================================================================

# ---------- Database ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Flyway clean deletes every table. Never in production.
spring.flyway.clean-disabled=true

# A database on the same machine as the app is refused unless IT sets this to true
# (it usually means DB_URL was copied from a developer's settings).
app.safety.allow-local-database=${ALLOW_LOCAL_DATABASE:false}

# ---------- ID-number keys (created and held by IT, never by developers) ----------
app.idnumber.lookup-key=${ID_NUMBER_LOOKUP_KEY}
app.idnumber.encryption-key=${ID_NUMBER_ENCRYPTION_KEY}

# ---------- Session cookie over HTTPS only ----------
server.servlet.session.cookie.secure=true

# ---------- Behind a reverse proxy / load balancer ----------
# Take the client address and https from X-Forwarded-For / X-Forwarded-Proto.
# Tomcat only trusts these headers from proxies on a private network, so the
# sign-in rate limit counts each user rather than the proxy.
server.forward-headers-strategy=native

# ---------- CORS ----------
# Empty: the frontend is served from the same address as the API.
# If it is not, IT sets CORS_ALLOWED_ORIGINS to its https:// address.
app.auth.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---------- First administrator (first start-up only, then removed) ----------
app.bootstrap.admin-email=${FIRST_ADMIN_EMAIL:}
app.bootstrap.admin-password=${FIRST_ADMIN_PASSWORD:}

# ---------- Errors and logging ----------
server.error.include-stacktrace=never
server.error.include-message=never
logging.level.root=INFO
