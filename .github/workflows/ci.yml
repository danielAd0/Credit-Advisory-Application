# Runs on every push to main and every pull request: the backend tests against a throwaway
# PostgreSQL, and the frontend lint and build. A red cross on GitHub means something here failed.
#
# No real data and no real keys: the tests use their own fake data and the test-only keys in
# backend/src/test/resources/application-test.properties. The database lives only for this run.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ca_user
          # Not a secret: different every run, for a database that is thrown away after it.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          # Must end in _test: the tests wipe it, and ApiTestBase refuses any other name.
          POSTGRES_DB: credit_advisory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ca_user -d credit_advisory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USERNAME: ca_user
      DB_PASSWORD: ci-${{ github.run_id }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # "sh mvnw": the wrapper is not marked executable in the repository.
      - name: Run the tests
        run: sh mvnw -B clean test

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
